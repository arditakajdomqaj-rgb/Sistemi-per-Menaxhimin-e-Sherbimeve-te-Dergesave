<!-- Shipment form: used for create (POST) and edit (PATCH) -->
<div class="modal fade" id="shipment-modal" tabindex="-1" aria-labelledby="shipment-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" id="shipment-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="shipment-modal-title">New shipment</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="shipment-form-error" class="alert alert-danger d-none" role="alert"></div>
        <div class="row g-3">
          <div class="col-12"><div class="form-section">Sender</div></div>
          <div class="col-md-6">
            <label class="form-label" for="f-sender_name">Full name</label>
            <input class="form-control" id="f-sender_name" name="sender_name" maxlength="100">
            <div class="invalid-feedback" data-for="sender_name"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="f-sender_phone">Phone</label>
            <input class="form-control" id="f-sender_phone" name="sender_phone" placeholder="+383 44 123 456">
            <div class="invalid-feedback" data-for="sender_phone"></div>
          </div>
          <div class="col-12">
            <label class="form-label" for="f-pickup_address">Pickup address</label>
            <input class="form-control" id="f-pickup_address" name="pickup_address" maxlength="255">
            <div class="invalid-feedback" data-for="pickup_address"></div>
          </div>

          <div class="col-12 mt-4"><div class="form-section">Recipient</div></div>
          <div class="col-md-6">
            <label class="form-label" for="f-receiver_name">Full name</label>
            <input class="form-control" id="f-receiver_name" name="receiver_name" maxlength="100">
            <div class="invalid-feedback" data-for="receiver_name"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="f-receiver_phone">Phone</label>
            <input class="form-control" id="f-receiver_phone" name="receiver_phone" placeholder="+383 45 987 654">
            <div class="invalid-feedback" data-for="receiver_phone"></div>
          </div>
          <div class="col-md-8">
            <label class="form-label" for="f-delivery_address">Delivery address</label>
            <input class="form-control" id="f-delivery_address" name="delivery_address" maxlength="255">
            <div class="invalid-feedback" data-for="delivery_address"></div>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="f-city">City</label>
            <input class="form-control" id="f-city" name="city" list="city-list" maxlength="60">
            <datalist id="city-list">
              <option value="Prishtina"><option value="Prizren"><option value="Peja"><option value="Gjakova">
              <option value="Ferizaj"><option value="Mitrovica"><option value="Gjilan">
            </datalist>
            <div class="invalid-feedback" data-for="city"></div>
          </div>

          <div class="col-12 mt-4"><div class="form-section">Parcel</div></div>
          <div class="col-md-6">
            <label class="form-label" for="f-weight_kg">Weight (kg)</label>
            <input class="form-control" id="f-weight_kg" name="weight_kg" type="number" step="0.01" min="0.01">
            <div class="invalid-feedback" data-for="weight_kg"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="f-price">Price (€)</label>
            <input class="form-control" id="f-price" name="price" type="number" step="0.01" min="0">
            <div class="invalid-feedback" data-for="price"></div>
          </div>
        </div>
        <p class="small text-secondary mt-3 mb-0">All fields are required.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="shipment-save">Create shipment</button>
      </div>
    </form>
  </div>
</div>
