{% load static %}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShipQuick{% endblock %}</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body data-page="{{ page }}">
{% block body %}
  <div class="app">
    {% include "partials/sidebar.html" %}
    <div class="main">
      <header class="topbar d-lg-none">
        <button class="btn-icon" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>
        <a class="brand" href="/"><span class="brand-mark"><i class="bi bi-box-seam"></i></span><span class="brand-name">ShipQuick</span></a>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
{% endblock %}

  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/ui.js' %}"></script>
  <script src="{% static 'js/layout.js' %}"></script>
  {% block page_js %}{% endblock %}
</body>
</html>
